version: '3.8'

services:
  # Redis for BullMQ
  redis:
    image: redis:7-alpine
    container_name: orcid-manager-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - orcid-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: orcid-manager-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-orcid_manager}
      MYSQL_USER: ${MYSQL_USER:-orcid_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-orcid_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - orcid-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ORCID Manager Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orcid-manager-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:      # Database
      DATABASE_URL: mysql://\${MYSQL_USER:-orcid_user}:\${MYSQL_PASSWORD:-orcid_password}@db:3306/\${MYSQL_DATABASE:-orcid_manager}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379     
      # JWT Secret
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      
      # OAuth Configuration (Manus)
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-https://api.manus.im}
      VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL:-https://portal.manus.im}
      VITE_APP_ID: ${VITE_APP_ID:-your-app-id}
      
      # Owner Information
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      OWNER_NAME: ${OWNER_NAME:-Admin}
      
      # App Configuration
      VITE_APP_TITLE: ${VITE_APP_TITLE:-ORCID Manager}
      VITE_APP_LOGO: ${VITE_APP_LOGO:-/logo.svg}
      
      # Forge API (Manus Built-in APIs)
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-https://forge.manus.im}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
      VITE_FRONTEND_FORGE_API_KEY: ${VITE_FRONTEND_FORGE_API_KEY:-}
      VITE_FRONTEND_FORGE_API_URL: ${VITE_FRONTEND_FORGE_API_URL:-https://forge.manus.im}
      
      # Analytics
      VITE_ANALYTICS_ENDPOINT: ${VITE_ANALYTICS_ENDPOINT:-}
      VITE_ANALYTICS_WEBSITE_ID: ${VITE_ANALYTICS_WEBSITE_ID:-}
      
      # Node Environment
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - orcid-network
    volumes:
      - app_uploads:/app/uploads

networks:
  orcid-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_uploads:
    driver: local
